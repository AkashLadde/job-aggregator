name: Daily Fresher Jobs Digest

on:
  schedule:
    # 7:00 AM IST = 1:30 AM UTC
    - cron: "30 1 * * *"
    # 7:00 PM IST = 1:30 PM UTC
    - cron: "30 13 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed to commit job_aggregator.db back (keeps dedupe memory between runs)

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  run-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Self-test (fresher filter + job source parsers, offline)
        run: |
          python -m tests.test_fresher_filter
          python -m tests.test_sources

      - name: Run the aggregator pipeline
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          # Extra free job APIs (optional - each source is skipped if its key is missing)
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}     # LinkedIn/Naukri/Indeed via Google for Jobs
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          # Optional settings: Settings -> Secrets and variables -> Actions -> Variables tab
          JOB_COUNTRIES: ${{ vars.JOB_COUNTRIES }}
          FRESHER_BATCH_YEARS: ${{ vars.FRESHER_BATCH_YEARS }}
          FRESHER_STRICT: ${{ vars.FRESHER_STRICT }}
          JSEARCH_PROVIDER: ${{ vars.JSEARCH_PROVIDER }}
          COMPANY_BOARDS: ${{ vars.COMPANY_BOARDS }}
          RSS_FEEDS: ${{ vars.RSS_FEEDS }}
        run: python main.py

      - name: Upload PDFs as workflow artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fresher-digest-${{ github.run_id }}
          path: |
            cybersecurity_digest.pdf
            general_cse_digest.pdf
          if-no-files-found: ignore
          retention-days: 14

      # Commit the DB back so dedupe state persists (Actions runners are wiped after each run).
      - name: Commit updated database
        if: always()
        run: |
          git config user.name "job-aggregator-bot"
          git config user.email "actions@github.com"
          git add job_aggregator.db || true
          git diff --cached --quiet || git commit -m "chore: update job DB $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase --autostash || true
          git push || echo "Nothing to push"
